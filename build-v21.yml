name: Build Negm Diarb V21 Final Magic Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V21 project
        run: |
          unzip -q "NegmDiarb_V21_Final.zip" -d build_v21
          cd build_v21
          rm -rf .github
          cp -r ../.gitignore .gitignore 2>/dev/null || true

      - name: Prepare stable signing key
        env:
          NEGMDIARB_KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
          NEGMDIARB_KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          NEGMDIARB_KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          NEGMDIARB_KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          test -n "$NEGMDIARB_KEYSTORE_B64"
          echo "$NEGMDIARB_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/negmdiarb-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        working-directory: build_v21
        run: gradle wrapper --gradle-version 8.7

      - name: Build signed V21 release
        working-directory: build_v21
        env:
          NEGMDIARB_KEYSTORE_FILE: ${{ github.workspace }}/negmdiarb-release.jks
          NEGMDIARB_KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          NEGMDIARB_KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          NEGMDIARB_KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Find V21 APK
        run: |
          mkdir -p out
          cp build_v21/app/build/outputs/apk/release/app-release.apk out/NegmDiarb-V21-Signed-APK.apk

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose out/NegmDiarb-V21-Signed-APK.apk

      - name: Upload V21 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V21-Signed-APK
          path: out/NegmDiarb-V21-Signed-APK.apk
