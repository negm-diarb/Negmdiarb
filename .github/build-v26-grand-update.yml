name: Build V26 Grand Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Check application ID
        run: |
          echo "Checking application ID..."
          grep -R "com.negmdiarb.app" -n app/build.gradle* || true

      - name: Disable problematic secondaryApp.delete call
        run: |
          if [ -f app/src/main/java/com/negmdiarb/app/MainActivity.java ]; then
            sed -i 's/try{secondaryApp\.delete();}catch(Exception ignored){}//' \
              app/src/main/java/com/negmdiarb/app/MainActivity.java
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare signed APK
        env:
          KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > negmdiarb-release.jks

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          echo "APK found: $APK"

          "$APKSIGNER" sign \
            --ks negmdiarb-release.jks \
            --ks-key-alias negmdiarb \
            --ks-pass pass: \
            --key-pass pass: \
            --out NegmDiarb-V26-GrandUpdate-Signed.apk \
            "$APK"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          "$APKSIGNER" verify --verbose \
            NegmDiarb-V26-GrandUpdate-Signed.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V26-GrandUpdate-Signed-APK
          path: NegmDiarb-V26-GrandUpdate-Signed.apk
          if-no-files-found: error
