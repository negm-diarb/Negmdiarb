name: Build Negm Diarb V19

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V19 project
        run: |
          rm -rf v19_project
          mkdir -p v19_project
          unzip -q "NegmDiarb_V19_Navigation_Camera.zip" -d v19_project

          PROJECT_DIR=$(find v19_project -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find v19_project -maxdepth 4 -type f | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/negmdiarb-release.jks"
          test -s "$RUNNER_TEMP/negmdiarb-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/negmdiarb-release.jks" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.7

      - name: Build signed V19
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | grep -i release | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner | head -n 1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        run: |
          cp "$APK" "$GITHUB_WORKSPACE/NegmDiarb_V19.apk"

      - name: Upload V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V19-Signed-APK
          path: NegmDiarb_V19.apk
