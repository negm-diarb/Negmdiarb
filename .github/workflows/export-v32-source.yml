name: Export V32 Source Code

on:
  push:
    paths:
      - ".github/workflows/export-v32-source.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Recreate exact V32 source
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname 'NegmDiarb_V27_*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf build_v32 && mkdir build_v32
          unzip -q "$ZIP" -d build_v32
          if [ ! -f build_v32/settings.gradle ] && [ ! -f build_v32/settings.gradle.kts ]; then
            ROOT="$(find build_v32 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            shopt -s dotglob
            cp -a "$ROOT"/. build_v32/
            rm -rf "$ROOT"
          fi
          cd build_v32
          python3 "$GITHUB_WORKSPACE/patch_v28.py"
          python3 "$GITHUB_WORKSPACE/patch_v29.py"
          python3 "$GITHUB_WORKSPACE/patch_v30.py"
          python3 "$GITHUB_WORKSPACE/patch_v32.py"
          test -f app/src/main/java/com/negmdiarb/app/MainActivity.java
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle || test -f app/build.gradle.kts
          grep -q 'adminReturnToPanel' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'createAdminNotification("rating"' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'createAdminNotification("complaint"' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'ضيف محلك ووسع تجارتك وخلي الناس توصلك' app/src/main/java/com/negmdiarb/app/MainActivity.java
          if grep -q 'currentAdminDeviceId' app/src/main/java/com/negmdiarb/app/MainActivity.java; then exit 1; fi

      - name: Export source bundle
        run: |
          set -e
          mkdir -p source_v32
          cp -a build_v32/app/src/main/java source_v32/
          cp -a build_v32/app/src/main/AndroidManifest.xml source_v32/
          cp -a build_v32/app/build.gradle* source_v32/ 2>/dev/null || true
          cp -a build_v32/build.gradle* source_v32/ 2>/dev/null || true
          cp -a build_v32/settings.gradle* source_v32/ 2>/dev/null || true
          cp -a build_v32/gradle.properties source_v32/ 2>/dev/null || true
          cp -a firestore.rules source_v32/ 2>/dev/null || true
          cp -a patch_v32.py source_v32/ 2>/dev/null || true
          cp -a .github/workflows/build-v32.yml source_v32/ 2>/dev/null || true
          printf '%s\n' 'V32 source generated from the same pipeline used by the signed V32 build.' > source_v32/README.txt
          zip -qr NegmDiarb-V32-Source-Code.zip source_v32

      - name: Upload V32 source
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V32-Source-Code
          path: NegmDiarb-V32-Source-Code.zip
          if-no-files-found: error

# source export ready
