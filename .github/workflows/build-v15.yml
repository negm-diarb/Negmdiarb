name: Build Negm Diarb V15 Complete

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEGMDIARB_KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
      NEGMDIARB_KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
      NEGMDIARB_KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V15 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="NegmDiarb_V15_Complete.zip"

          echo "Checking V15 ZIP..."
          test -f "$ZIP_FILE"

          rm -rf "$RUNNER_TEMP/negm_v15"
          mkdir -p "$RUNNER_TEMP/negm_v15"

          echo "Extracting V15..."
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/negm_v15"

          echo "Finding Android project..."

          PROJECT_DIR=$(find "$RUNNER_TEMP/negm_v15" \
            -type f -name settings.gradle \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$RUNNER_TEMP/negm_v15" \
              -type f -name settings.gradle.kts \
              -print -quit | xargs -r dirname)
          fi

          test -n "$PROJECT_DIR"

          echo "Project found:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Check V15 project
        run: |
          set -e

          echo "Checking applicationId..."
          grep -n "applicationId" app/build.gradle

          echo "Checking versionCode..."
          grep -n "versionCode" app/build.gradle

          echo "Checking versionName..."
          grep -n "versionName" app/build.gradle

          test -f app/src/main/java/com/negmdiarb/app/MainActivity.java
          test -f app/src/main/res/layout/activity_main.xml

      - name: Prepare stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/negm-release.keystore"

          test -s "$RUNNER_TEMP/negm-release.keystore"

          echo "Stable signing key prepared."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build signed V15 release
        env:
          NEGMDIARB_KEYSTORE_FILE: ${{ runner.temp }}/negm-release.keystore
        run: |
          set -e

          ./gradlew clean assembleRelease --no-daemon

          test -f app/build/outputs/apk/release/app-release.apk

          echo "V15 APK created successfully."

      - name: Verify APK signature
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "Verifying APK..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          echo ""
          echo "========== CERTIFICATE =========="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --print-certs "$APK"

      - name: Check APK information
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "========== APK INFORMATION =========="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" |
            grep -E "package: name=|versionCode=|versionName="

      - name: Upload V15 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V15-Complete-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
