name: Build Negm Diarb V27

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v27.yml"
      - "NegmDiarb_V27_*.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract V27 project
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname 'NegmDiarb_V27_*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: No NegmDiarb_V27_*.zip file found."
            exit 1
          fi
          echo "Using V27 archive: $ZIP"
          rm -rf build_v27
          mkdir -p build_v27
          unzip -q "$ZIP" -d build_v27
          rm -rf build_v27/.github

          if [ ! -f build_v27/settings.gradle ] && [ ! -f build_v27/settings.gradle.kts ]; then
            ROOT="$(find build_v27 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$ROOT" ] && { [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; }; then
              shopt -s dotglob
              cp -a "$ROOT"/. build_v27/
              rm -rf "$ROOT"
            fi
          fi

          test -f build_v27/settings.gradle || test -f build_v27/settings.gradle.kts
          test -f build_v27/app/build.gradle || test -f build_v27/app/build.gradle.kts

          MAIN_JAVA="build_v27/app/src/main/java/com/negmdiarb/app/MainActivity.java"
          if [ -f "$MAIN_JAVA" ]; then
            sed -i 's/try{secondaryApp\.delete();}catch(Exception ignored){}/try{}catch(Exception ignored){}/g' "$MAIN_JAVA"
          fi

      - name: Force V27 version
        working-directory: build_v27
        run: |
          set -e

          FILE="app/build.gradle"
          if [ -f "app/build.gradle.kts" ]; then
            FILE="app/build.gradle.kts"
          fi

          python3 - "$FILE" <<'PY'
          import re, sys

          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          # Support both Groovy and Kotlin Gradle syntax, with or without '='
          # and with either single or double quotes around versionName.
          s, n = re.subn(
              r'versionCode\s*(?:=\s*)?\d+',
              'versionCode = 27',
              s,
              count=1
          )
          s, m = re.subn(
              r'versionName\s*(?:=\s*)?[\'"][^\'"]*[\'"]',
              'versionName = "v27-grand-update-1.0"',
              s,
              count=1
          )

          if n != 1:
              raise SystemExit("ERROR: Could not set versionCode to 27.")
          if m != 1:
              raise SystemExit("ERROR: Could not set versionName.")

          open(p, "w", encoding="utf-8").write(s)
          PY

          echo "Checking application ID..."
          grep -R "com.negmdiarb.app" app --include="*.gradle" --include="*.gradle.kts"

          echo "Checking version..."
          grep -R "versionCode" app --include="*.gradle" --include="*.gradle.kts"
          grep -R "versionName" app --include="*.gradle" --include="*.gradle.kts"

      - name: Prepare stable signing key
        env:
          NEGMDIARB_KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$NEGMDIARB_KEYSTORE_B64"
          echo "$NEGMDIARB_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/negmdiarb-release.jks"
          test -s "$GITHUB_WORKSPACE/negmdiarb-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: build_v27
        run: |
          set -e
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build V27 signed release
        working-directory: build_v27
        env:
          NEGMDIARB_KEYSTORE_FILE: ${{ github.workspace }}/negmdiarb-release.jks
          NEGMDIARB_KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          NEGMDIARB_KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          NEGMDIARB_KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          set -e
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Check APK
        run: |
          set -e
          APK="build_v27/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Prepare final APK
        run: |
          set -e
          mkdir -p out
          cp "build_v27/app/build/outputs/apk/release/app-release.apk" "out/NegmDiarb-V27-Signed-APK.apk"

      - name: Verify APK signature
        run: |
          set -e
          APK="out/NegmDiarb-V27-Signed-APK.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Show APK certificate
        run: |
          set -e
          APK="out/NegmDiarb-V27-Signed-APK.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload V27 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V27-Signed-APK
          path: out/NegmDiarb-V27-Signed-APK.apk
          if-no-files-found: error

      - name: Build completed
        run: |
          echo "========================================"
          echo "NEGMDIARB V27"
          echo "BUILD COMPLETED"
          echo "========================================"
