name: Build Negm Diarb V13 Final UI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V13 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="NegmDiarb_V13_Final_UI.zip"

          echo "Checking V13 ZIP..."
          test -f "$ZIP_FILE"

          rm -rf /tmp/negm_v13
          mkdir -p /tmp/negm_v13

          echo "Extracting V13..."
          unzip -q "$ZIP_FILE" -d /tmp/negm_v13

          echo "Finding Android project..."

          PROJECT_DIR=$(find /tmp/negm_v13 -type f -name settings.gradle -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/negm_v13 -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          fi

          test -n "$PROJECT_DIR"

          echo "Project found at:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Decode stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/negm-release.keystore"

          test -s "$RUNNER_TEMP/negm-release.keystore"

          echo "Signing keystore prepared successfully."

      - name: Build V13 release APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean assembleRelease --no-daemon

      - name: Sign V13 APK with stable key
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/negm-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          set -e

          echo "Finding Android Build Tools..."

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          test -n "$BUILD_TOOLS"

          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          test -f "$APKSIGNER"
          test -f "$ZIPALIGN"

          echo "Android Build Tools:"
          echo "$BUILD_TOOLS"

          INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$INPUT_APK" ]; then
            INPUT_APK="app/build/outputs/apk/release/app-release.apk"
          fi

          test -f "$INPUT_APK"

          mkdir -p app/build/outputs/final

          TEMP_APK="$RUNNER_TEMP/NegmDiarb-V13-aligned.apk"
          FINAL_APK="app/build/outputs/final/NegmDiarb-V13.apk"

          echo "Aligning APK..."

          "$ZIPALIGN" -f -p 4 \
            "$INPUT_APK" \
            "$TEMP_APK"

          test -f "$TEMP_APK"

          echo "Signing APK..."

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$TEMP_APK"

          test -f "$FINAL_APK"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify --verbose "$FINAL_APK"

          echo "V13 signed APK created successfully."

      - name: Upload V13 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V13-Final-APK
          path: app/build/outputs/final/NegmDiarb-V13.apk
          if-no-files-found: error
