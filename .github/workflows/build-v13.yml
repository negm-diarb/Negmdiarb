name: Build Negm Diarb V13 Final UI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEGMDIARB_KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
      NEGMDIARB_KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
      NEGMDIARB_KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V13 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="NegmDiarb_V13_Final_UI.zip"

          echo "Checking V13 ZIP..."
          test -f "$ZIP_FILE"

          rm -rf /tmp/negm_v13
          mkdir -p /tmp/negm_v13

          echo "Extracting V13..."
          unzip -q "$ZIP_FILE" -d /tmp/negm_v13

          echo "Finding Android project..."

          PROJECT_DIR=$(find /tmp/negm_v13 \
            -type f \
            -name settings.gradle \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/negm_v13 \
              -type f \
              -name settings.gradle.kts \
              -print -quit | xargs -r dirname)
          fi

          test -n "$PROJECT_DIR"

          echo "Project found at:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Fix V13 Java source
        shell: python
        run: |
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/negmdiarb/app/MainActivity.java"
          )

          text = p.read_text(encoding="utf-8")

          broken = (
              'safe(d.getString("status"))+"\n'
              '🏪 المنشأة: "'
          )

          fixed = (
              'safe(d.getString("status"))+"\\n'
              '🏪 المنشأة: "'
          )

          if broken in text:
              text = text.replace(broken, fixed)
              p.write_text(text, encoding="utf-8")
              print("V13 Java source fixed successfully.")
          else:
              print("The known broken string was not found.")
              print("Continuing with the source as-is.")

      - name: Verify V13 source
        shell: bash
        run: |
          set -e

          echo "Checking MainActivity.java..."

          test -f app/src/main/java/com/negmdiarb/app/MainActivity.java

          echo "MainActivity.java exists."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Prepare stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          set -e

          echo "Checking signing secrets..."

          test -n "$KEYSTORE_B64"
          test -n "$NEGMDIARB_KEYSTORE_PASSWORD"
          test -n "$NEGMDIARB_KEY_ALIAS"
          test -n "$NEGMDIARB_KEY_PASSWORD"

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/negm-release.keystore"

          test -s "$RUNNER_TEMP/negm-release.keystore"

          echo "Stable signing key prepared successfully."

      - name: Build V13 signed release APK
        shell: bash
        env:
          NEGMDIARB_KEYSTORE_FILE: ${{ runner.temp }}/negm-release.keystore
        run: |
          set -e

          chmod +x ./gradlew

          echo "Building V13 release APK..."

          ./gradlew clean assembleRelease --no-daemon

          test -f app/build/outputs/apk/release/app-release.apk

          echo "V13 release APK built successfully."

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK found:"
          ls -lh "$APK"

      - name: Upload V13 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V13-Final-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
