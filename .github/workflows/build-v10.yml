name: Build Negm Diarb V10 UI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V10 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="NegmDiarb_V10_UI_FIXED.zip"

          echo "Checking V10 ZIP..."
          test -f "$ZIP_FILE"

          rm -rf /tmp/negm_v10
          mkdir -p /tmp/negm_v10

          echo "Extracting V10 project..."
          unzip -q "$ZIP_FILE" -d /tmp/negm_v10

          echo "Finding Android project..."
          PROJECT_DIR=$(find /tmp/negm_v10 -name settings.gradle -type f -print -quit | xargs dirname)

          test -n "$PROJECT_DIR"

          echo "Project directory: $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build V10 APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V10-UI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
