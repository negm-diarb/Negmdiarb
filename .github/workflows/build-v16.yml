name: Build Negm Diarb V16 Admin Hidden

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V16 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="NegmDiarb_V16_Admin_Hidden.zip"

          echo "Checking V16 ZIP..."
          test -f "$ZIP_FILE"

          rm -rf /tmp/negm_v16
          mkdir -p /tmp/negm_v16

          echo "Extracting V16..."
          unzip -q "$ZIP_FILE" -d /tmp/negm_v16

          echo "Finding Android project..."

          PROJECT_DIR=$(find /tmp/negm_v16 \
            -type f \
            -name settings.gradle \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/negm_v16 \
              -type f \
              -name settings.gradle.kts \
              -print -quit | xargs -r dirname)
          fi

          test -n "$PROJECT_DIR"

          echo "Project found at:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Check V16 project
        shell: bash
        run: |
          set -e

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

          echo "Android project OK"

      - name: Prepare stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/negm_diarb_release.keystore"

          test -s "$RUNNER_TEMP/negm_diarb_release.keystore"

          echo "Stable signing key prepared."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build V16 release
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/negm_diarb_release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Find V16 APK
        shell: bash
        run: |
          set -e

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/negm_diarb_release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          echo "Verifying APK..."

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK signature verified."

      - name: Check APK information
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          echo "APK:"
          echo "$APK"

          ls -lh "$APK"

          echo "Package/version information:"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | \
            grep -E "package:|versionCode|versionName" || true

      - name: Rename APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          cp "$APK" "NegmDiarb_V16_Admin_Hidden.apk"

          ls -lh "NegmDiarb_V16_Admin_Hidden.apk"

      - name: Upload V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V16-Admin-Hidden-APK
          path: NegmDiarb_V16_Admin_Hidden.apk
          if-no-files-found: error
