name: Build Negm Diarb V30 Full Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "patch_v28.py"
      - "patch_v29.py"
      - "patch_v30.py"
      - "firestore.rules"
      - "storage.rules"
      - "assets/negm_icon_user.jpg"
      - ".github/workflows/build-v30.yml"
      - "NegmDiarb_V27_GrandSecurityUpdate.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract source
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname 'NegmDiarb_V27_*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf build_v30 && mkdir build_v30
          unzip -q "$ZIP" -d build_v30
          if [ ! -f build_v30/settings.gradle ] && [ ! -f build_v30/settings.gradle.kts ]; then
            ROOT="$(find build_v30 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            shopt -s dotglob; cp -a "$ROOT"/. build_v30/; rm -rf "$ROOT"
          fi
          test -f build_v30/settings.gradle || test -f build_v30/settings.gradle.kts
      - name: Apply V28
        working-directory: build_v30
        run: python3 "$GITHUB_WORKSPACE/patch_v28.py"
      - name: Apply V29
        working-directory: build_v30
        run: python3 "$GITHUB_WORKSPACE/patch_v29.py"
      - name: Apply V30 full fixes
        working-directory: build_v30
        run: python3 "$GITHUB_WORKSPACE/patch_v30.py"
      - name: Set version 30
        working-directory: build_v30
        run: |
          set -e
          FILE="app/build.gradle"; [ -f "$FILE" ] || FILE="app/build.gradle.kts"
          python3 - "$FILE" <<'PY'
          import re,sys
          p=sys.argv[1]; s=open(p,encoding="utf-8").read()
          s,n=re.subn(r'versionCode\s*(?:=\s*)?\d+','versionCode = 30',s,count=1)
          s,m=re.subn(r'versionName\s*(?:=\s*)?["\'][^"\']*["\']','versionName = "v30-full-fix-1.0"',s,count=1)
          if n!=1 or m!=1: raise SystemExit("version update failed")
          open(p,"w",encoding="utf-8").write(s)
          PY
      - name: Signing key
        env:
          K: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$K"
          echo "$K" | base64 --decode > "$GITHUB_WORKSPACE/negmdiarb-release.jks"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Wrapper
        working-directory: build_v30
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build signed V30
        working-directory: build_v30
        env:
          NEGMDIARB_KEYSTORE_FILE: ${{ github.workspace }}/negmdiarb-release.jks
          NEGMDIARB_KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          NEGMDIARB_KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          NEGMDIARB_KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace
      - name: Verify
        run: |
          set -e
          APK="build_v30/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
      - name: Artifact
        run: |
          mkdir -p out
          cp build_v30/app/build/outputs/apk/release/app-release.apk out/NegmDiarb-V30-FullFix-Signed.apk
          cp firestore.rules out/firestore.rules
          cp storage.rules out/storage.rules
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V30-FullFix
          path: |
            out/NegmDiarb-V30-FullFix-Signed.apk
            out/firestore.rules
            out/storage.rules
          if-no-files-found: error
