name: Build Negm Diarb V17 Camera Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V17 project
        run: |
          rm -rf v17_project
          mkdir -p v17_project
          unzip -q "NegmDiarb_V17_Camera_Fix.zip" -d v17_project

          PROJECT_DIR=$(find v17_project -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find v17_project -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Check V17 project
        run: |
          cd "$PROJECT_DIR"
          find . -maxdepth 3 -type f | sort | head -150

      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/negmdiarb-release.jks"

          test -s "$RUNNER_TEMP/negmdiarb-release.jks"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/negmdiarb-release.jks" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.7

      - name: Build signed V17 release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Find V17 APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | grep -i release | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Found APK: $APK"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner | head -n 1)

          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        run: |
          cp "$APK" "$GITHUB_WORKSPACE/NegmDiarb_V17_Camera_Fix.apk"

      - name: Upload V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V17-Camera-Fix-Signed-APK
          path: NegmDiarb_V17_Camera_Fix.apk
