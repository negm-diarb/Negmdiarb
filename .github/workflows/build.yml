name: Build Negm Diarb APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o NegmDiarb_GitHub_Build_v3.zip -d project
          cp -r project/* .
          cp -r project/.[!.]* . 2>/dev/null || true

      - name: Fix ML Kit OCR and FileProvider
        run: |
          sed -i "s#com.google.mlkit:text-recognition-arabic:16.0.0#com.google.mlkit:text-recognition:16.0.1#g" app/build.gradle
          sed -i "s#import com.google.mlkit.vision.text.arabic.ArabicTextRecognizerOptions;#import com.google.mlkit.vision.text.latin.TextRecognizerOptions;#g" app/src/main/java/com/negmdiarb/app/MainActivity.java
          sed -i "s#TextRecognition.getClient(new ArabicTextRecognizerOptions.Builder().build())#TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)#g" app/src/main/java/com/negmdiarb/app/MainActivity.java
          sed -i '/import android.content.FileProvider;/d' app/src/main/java/com/negmdiarb/app/MainActivity.java
          sed -i '/package com.negmdiarb.app;/a import androidx.core.content.FileProvider;' app/src/main/java/com/negmdiarb/app/MainActivity.java

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-APK
          path: app/build/outputs/apk/debug/app-debug.apk
