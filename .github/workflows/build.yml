name: Build Negm Diarb V7 Cloud APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract V7 Cloud project
        run: |
          unzip -o NegmDiarb_V7_Cloud_Firebase.zip -d project
          rsync -a project/NegmDiarb_v6/ ./ --exclude='.github'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build V7 Cloud APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload V7 Cloud APK
        uses: actions/upload-artifact@v
