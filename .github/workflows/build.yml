name: Build Negm Diarb V7 Cloud APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare V7 project
        run: |
          rm -rf app
          rm -rf project
          mkdir -p project

          unzip -o NegmDiarb_V7_Cloud_Firebase_FIXED.zip -d project

          cp -r project/NegmDiarb_v6/. .

          echo "V7 project prepared successfully"
          echo "Checking MainActivity:"
          wc -l app/src/main/java/com/negmdiarb/app/MainActivity.java

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build V7 Cloud APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload V7 Cloud APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V7-Cloud-APK
          path: app/build/outputs/apk/debug/app-debug.apk
