name: Build Negm Diarb V7 Cloud APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V7 FIXED project
        shell: bash
        run: |
          set -e

          echo "Searching for V7 FIXED ZIP..."

          ZIP_FILE="NegmDiarb_V7_Cloud_Firebase_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf /tmp/negm_v7
          mkdir -p /tmp/negm_v7

          unzip -q "$ZIP_FILE" -d /tmp/negm_v7

          PROJECT_DIR=$(find /tmp/negm_v7 -name settings.gradle -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found!"
            find /tmp/negm_v7 -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          echo "Checking MainActivity.java..."

          MAIN_FILE="app/src/main/java/com/negmdiarb/app/MainActivity.java"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.java not found!"
            find app -name "MainActivity.java" -print
            exit 1
          fi

          echo "MainActivity.java found."

          echo "Checking project files..."
          ls -la
          ls -la app

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build V7 Cloud APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload V7 Cloud APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V7-Cloud-APK
          path: app/build/outputs/apk/debug/app-debug.apk
