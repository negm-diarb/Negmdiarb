name: Build Negm Diarb V13 Final Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V13 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="NegmDiarb_V13_Final_UI.zip"

          echo "Checking V13 ZIP..."
          test -f "$ZIP_FILE"

          rm -rf /tmp/negm_v13
          mkdir -p /tmp/negm_v13

          echo "Extracting V13..."
          unzip -q "$ZIP_FILE" -d /tmp/negm_v13

          echo "Finding Android project..."

          PROJECT_DIR=$(find /tmp/negm_v13 -type f -name settings.gradle -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/negm_v13 -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          fi

          test -n "$PROJECT_DIR"

          echo "Project found:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build V13
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/negm_diarb_release.keystore"

          test -s "$RUNNER_TEMP/negm_diarb_release.keystore"

          echo "Signing keystore prepared."

      - name: Locate APK tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)

          test -n "$BUILD_TOOLS"

          echo "Build tools:"
          echo "$BUILD_TOOLS"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          INPUT_APK="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED_APK="app/build/outputs/apk/debug/app-v13-aligned.apk"

          test -f "$INPUT_APK"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT_APK" "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

      - name: Sign APK with permanent key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-v13-aligned.apk"

          test -f "$APK"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/negm_diarb_release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "app/build/outputs/apk/debug/NegmDiarb-V13-signed.apk" \
            "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/NegmDiarb-V13-signed.apk"

          test -f "$APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload V13 APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V13-Signed-APK
          path: app/build/outputs/apk/debug/NegmDiarb-V13-signed.apk
