name: Build Negm Diarb V33 Performance Images Owners

on:
  push:
    paths:
      - "patch_v33.py"
      - ".github/workflows/build-v33.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract stable source
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname 'NegmDiarb_V27_*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf build_v33 && mkdir build_v33
          unzip -q "$ZIP" -d build_v33
          if [ ! -f build_v33/settings.gradle ] && [ ! -f build_v33/settings.gradle.kts ]; then
            ROOT="$(find build_v33 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            shopt -s dotglob
            cp -a "$ROOT"/. build_v33/
            rm -rf "$ROOT"
          fi
      - name: Apply V28
        working-directory: build_v33
        run: python3 "$GITHUB_WORKSPACE/patch_v28.py"
      - name: Apply V29
        working-directory: build_v33
        run: python3 "$GITHUB_WORKSPACE/patch_v29.py"
      - name: Apply V30
        working-directory: build_v33
        run: python3 "$GITHUB_WORKSPACE/patch_v30.py"
      - name: Apply stable V32 fixes
        working-directory: build_v33
        run: python3 "$GITHUB_WORKSPACE/patch_v32.py"
      - name: Apply V33 fixes
        working-directory: build_v33
        run: python3 "$GITHUB_WORKSPACE/patch_v33.py"
      - name: Verify source fixes
        working-directory: build_v33
        run: |
          set -e
          grep -q 'adminReturnToPanel' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'createAdminNotification("rating"' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'createAdminNotification("complaint"' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'encodeImagesForFirestoreAsync' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'imageDataUrls' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'limit(60)' app/src/main/java/com/negmdiarb/app/MainActivity.java
          grep -q 'ضيف محلك ووسع تجارتك وخلي الناس توصلك' app/src/main/java/com/negmdiarb/app/MainActivity.java
      - name: Set V33 version
        working-directory: build_v33
        run: |
          set -e
          FILE="app/build.gradle"
          [ -f "$FILE" ] || FILE="app/build.gradle.kts"
          python3 - "$FILE" <<'PY'
          import re,sys
          p=sys.argv[1]
          s=open(p,encoding="utf-8").read()
          s,n=re.subn(r'versionCode\s*(?:=\s*)?\d+','versionCode = 33',s,count=1)
          s,m=re.subn(r'versionName\s*(?:=\s*)?["\'][^"\']*["\']','versionName = "v33-performance-images-owners-1.0"',s,count=1)
          if n!=1 or m!=1: raise SystemExit("version update failed")
          open(p,"w",encoding="utf-8").write(s)
          PY
      - name: Signing key
        env:
          K: ${{ secrets.NEGMDIARB_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$K"
          echo "$K" | base64 --decode > "$GITHUB_WORKSPACE/negmdiarb-release.jks"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Wrapper
        working-directory: build_v33
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build signed V33
        working-directory: build_v33
        env:
          NEGMDIARB_KEYSTORE_FILE: ${{ github.workspace }}/negmdiarb-release.jks
          NEGMDIARB_KEYSTORE_PASSWORD: ${{ secrets.NEGMDIARB_KEYSTORE_PASSWORD }}
          NEGMDIARB_KEY_ALIAS: ${{ secrets.NEGMDIARB_KEY_ALIAS }}
          NEGMDIARB_KEY_PASSWORD: ${{ secrets.NEGMDIARB_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace
      - name: Verify V33 signature
        run: |
          set -e
          APK="build_v33/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q 'a4e0ab397c04a777877cd88fb429a7ee1f537de33c073032fb2b7f159e6cc830' /tmp/certs.txt
      - name: Export V33 source
        working-directory: build_v33
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/source_v33"
          cp -a app/src/main/java "$GITHUB_WORKSPACE/source_v33/"
          cp -a app/src/main/AndroidManifest.xml "$GITHUB_WORKSPACE/source_v33/"
          cp -a app/build.gradle* "$GITHUB_WORKSPACE/source_v33/" 2>/dev/null || true
          cp -a build.gradle* "$GITHUB_WORKSPACE/source_v33/" 2>/dev/null || true
          cp -a settings.gradle* "$GITHUB_WORKSPACE/source_v33/" 2>/dev/null || true
          cp -a gradle.properties "$GITHUB_WORKSPACE/source_v33/" 2>/dev/null || true
          cp -a "$GITHUB_WORKSPACE/firestore.rules" "$GITHUB_WORKSPACE/source_v33/" 2>/dev/null || true
          printf '%s\n' 'V33 source generated from the same signed build pipeline.' > "$GITHUB_WORKSPACE/source_v33/README.txt"
          cd "$GITHUB_WORKSPACE"
          zip -qr NegmDiarb-V33-Source-Code.zip source_v33
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V33-Performance-Images-Owners
          path: build_v33/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: NegmDiarb-V33-Source-Code
          path: NegmDiarb-V33-Source-Code.zip
          if-no-files-found: error
