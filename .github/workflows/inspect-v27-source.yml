name: Inspect V27 Source Temporarily

on:
  push:
    paths:
      - ".github/workflows/inspect-v27-source.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact methods
        run: |
          set -e
          rm -rf inspect && mkdir inspect
          unzip -q NegmDiarb_V27_GrandSecurityUpdate.zip -d inspect
          if [ ! -f inspect/settings.gradle ] && [ ! -f inspect/settings.gradle.kts ]; then
            ROOT="$(find inspect -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            shopt -s dotglob
            cp -a "$ROOT"/. inspect/
          fi
          J=inspect/app/src/main/java/com/negmdiarb/app/MainActivity.java
          M=inspect/app/src/main/AndroidManifest.xml
          python3 - "$J" <<'PY'
          import re,sys
          lines=open(sys.argv[1],encoding='utf-8').read().splitlines()
          sig=re.compile(r'^\\s+(?:public |private |protected )?(?:static )?(?:final )?[\\w<>?, .\\[\]]+\\s+(\\w+)\\s*\\([^;]*\\)\\s*\\{')
          methods=[]
          for i,line in enumerate(lines):
              m=sig.match(line)
              if m: methods.append((i+1,m.group(1),line.strip()))
          print("=== ALL METHOD SIGNATURES ===")
          for x in methods: print(f"{x[0]}: {x[2]}")
          targets={'showAdmin','addBusiness','saveBusiness','addOffer','createOwnerAccount','createAuthUser','loadRatings','loadOffers','loadRequests','loadComplaints','showRatingDialog','installBackHandler','renderThumbs','uploadImages','uploadImage','showHome','showAdd','showOffers','showBusinessDetails','approveRating','approveOffer','approveBusiness','sendComplaint'}
          print("=== TARGET METHOD BODIES ===")
          for start,name,line in methods:
              if name not in targets: continue
              depth=0; started=False; end=start
              for j in range(start-1,len(lines)):
                  depth += lines[j].count('{')-lines[j].count('}')
                  if '{' in lines[j]: started=True
                  if started and depth==0:
                      end=j+1; break
              print(f"--- {name} lines {start}-{end} ---")
              for j in range(start-1,min(end,start+220)-1): print(f"{j+1}: {lines[j]}")
          PY
          echo "=== MANIFEST ==="
          cat "$M"
