name: Inspect V27 Source Temporarily

on:
  push:
    paths:
      - ".github/workflows/inspect-v27-source.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted source
        run: |
          set -e
          rm -rf inspect && mkdir inspect
          unzip -q NegmDiarb_V27_GrandSecurityUpdate.zip -d inspect
          if [ ! -f inspect/settings.gradle ] && [ ! -f inspect/settings.gradle.kts ]; then
            ROOT="$(find inspect -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            shopt -s dotglob
            cp -a "$ROOT"/. inspect/
          fi
          J=inspect/app/src/main/java/com/negmdiarb/app/MainActivity.java
          L=inspect/app/src/main/res/layout/activity_main.xml
          M=inspect/app/src/main/AndroidManifest.xml
          echo "=== METHODS ==="
          grep -nE '^    (void|boolean|String|LinearLayout|TextView|Button|interface|double|int) [A-Za-z0-9_]+\\(' "$J" | head -n 220
          echo "=== TARGETED METHODS ==="
          python3 - "$J" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8').read().splitlines()
          targets=['showAdmin','addBusiness','saveBusiness','addOffer','createOwnerAccount','createAuthUser','loadRatings','loadOffers','loadRequests','loadComplaints','showRatingDialog','installBackHandler','renderThumbs','storage','showHome','showAdd','showOffer','showBusinessDetails']
          for i,line in enumerate(s):
              if any(t in line for t in targets):
                  print(f"--- line {i+1}: {line.strip()} ---")
                  for j in range(max(0,i-5),min(len(s),i+35)):
                      print(f"{j+1}: {s[j]}")
          PY
          echo "=== MANIFEST ==="
          cat "$M"
          echo "=== LAYOUT IDs/TEXT ==="
          grep -nE 'android:id=|android:text=' "$L" | head -n 260
