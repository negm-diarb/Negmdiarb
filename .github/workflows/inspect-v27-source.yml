name: Inspect V27 Source Temporarily

on:
  push:
    paths:
      - ".github/workflows/inspect-v27-source.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect key methods
        run: |
          set -e
          rm -rf inspect && mkdir inspect
          unzip -q NegmDiarb_V27_GrandSecurityUpdate.zip -d inspect
          if [ ! -f inspect/settings.gradle ] && [ ! -f inspect/settings.gradle.kts ]; then
            ROOT="$(find inspect -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            shopt -s dotglob
            cp -a "$ROOT"/. inspect/
          fi
          J=inspect/app/src/main/java/com/negmdiarb/app/MainActivity.java
          echo "=== KEY METHOD SIGNATURES ==="
          grep -nE '^[[:space:]]*(public |private |protected )?(static )?.*(void|boolean|String|LinearLayout|TextView|Button).* (addBusinessCard|showRatingDialog|createOwnerAccount|createAuthUser|installBackHandler|addOffer|approveRating|approveOffer|approveBusiness|sendComplaint|showHome|showBusinessDetails|saveBusiness|uploadImage|uploadImages)[[:space:]]*\\(' "$J" || true
          for N in addBusinessCard showRatingDialog createOwnerAccount createAuthUser installBackHandler addOffer approveRating approveOffer approveBusiness sendComplaint showHome showBusinessDetails saveBusiness uploadImage uploadImages; do
            LINE=$(grep -nE "^[[:space:]]*(public |private |protected )?(static )?.* (void|boolean|String|LinearLayout|TextView|Button).* $N[[:space:]]*\\(" "$J" | head -n 1 | cut -d: -f1 || true)
            if [ -n "$LINE" ]; then
              echo "=== $N line $LINE ==="
              sed -n "$LINE,$((LINE+110))p" "$J"
            fi
          done
